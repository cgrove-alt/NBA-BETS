name: Evaluation Spec Gate Checks

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      promote:
        description: 'Set to true to run promotion approval job'
        required: false
        default: 'false'
        type: string

jobs:
  gate-checks:
    name: Run Realism Gate Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation spec gate tests
        run: |
          python -m pytest tests/eval_spec_tests/ -v --tb=short -ra 2>&1 | tee gate_results.txt
          # Note: tests are EXPECTED to fail currently (documenting spec gaps).
          # When gates are implemented, failures will block merges.

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-results
          path: gate_results.txt
          retention-days: 30

  promotion-approval:
    name: Model Promotion (Manual Approval Required)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote == 'true'
    environment: promotion
    needs: gate-checks
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Verify all gates pass
        run: |
          echo "========================================="
          echo "MODEL PROMOTION GATE CHECK"
          echo "========================================="
          echo ""
          echo "This job requires manual approval via the"
          echo "'promotion' environment protection rule."
          echo ""
          echo "Before approving, verify:"
          echo "  1. All 8 realism gates pass"
          echo "  2. CLV is positive over test window"
          echo "  3. No unresolved CRITICAL audit issues"
          echo ""
          echo "Configure environment protection rules at:"
          echo "  Settings > Environments > promotion > Required reviewers"
          echo "========================================="
