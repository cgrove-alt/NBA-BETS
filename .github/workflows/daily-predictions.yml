name: Daily Predictions

on:
  schedule:
    - cron: '0 14 * * *'  # 2 PM UTC = 10 AM ET (after retrain at 8 AM UTC)
  workflow_dispatch:
    inputs:
      date:
        description: 'Prediction date (YYYY-MM-DD), defaults to today'
        required: false

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p data/predictions logs

      - name: Settle yesterday's predictions
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python -c "
          from nba_betting.settle_trades import settle_yesterday
          settled = settle_yesterday()
          print(f'Settled {settled} trades')
          " || echo "Settlement skipped (no trades to settle)"

      - name: Generate daily predictions
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set -o pipefail
          TARGET_DATE="${{ github.event.inputs.date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date -u +%Y-%m-%d)
          fi
          python daily_predictions.py --date "$TARGET_DATE" --output-dir data/predictions 2>&1 | tee logs/predictions_output.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictions-${{ github.run_id }}
          path: |
            data/predictions/
            logs/predictions_output.log
          retention-days: 30

      - name: Commit predictions
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase  # Avoid conflicts with retrain commits
          git add data/predictions/ || true
          if ! git diff --staged --quiet; then
            COMMIT_MSG="Daily predictions $(date +%Y-%m-%d)

Automated predictions via GitHub Actions.
Run ID: ${{ github.run_id }}"
            git commit -m "$COMMIT_MSG"
            git push
          else
            echo "No prediction files to commit"
          fi

      - name: Report failure
        if: failure()
        run: echo "::error::Daily predictions failed! Check the logs."
