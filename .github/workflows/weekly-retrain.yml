name: Daily Model Retrain

on:
  schedule:
    # Daily at 8 AM UTC (3 AM EST) - changed from weekly for fresher models
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Needed to push retrained models back to repo

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # OOF cross-validation can take 2-4 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create logs directory
        run: mkdir -p logs

      - name: Validate required secrets
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          if [ -z "$BALLDONTLIE_API_KEY" ]; then
            echo "::error::BALLDONTLIE_API_KEY secret is not set. Add it at: Settings > Secrets > Actions"
            exit 1
          fi
          echo "All required secrets validated."

      - name: Run scheduled retraining (CSV-based pipeline)
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          set -o pipefail
          # train_from_csv.py is the correct entry point:
          # - 3-way temporal split (60/20/20) prevents early stopping leakage
          # - Minutes model trained on first 60% only
          # - Post-training bias correction on validation set
          # - Phase 4 situational features (B2B, blowout, spread magnitude)
          python train_from_csv.py 2>&1 | tee logs/retrain_output.log

      - name: Run post-retrain calibration
        if: success()
        run: |
          python scripts/calibrate_quantile_decompression.py 2>&1 | tee -a logs/retrain_output.log
          python scripts/build_probability_calibration.py 2>&1 | tee -a logs/retrain_output.log

      - name: Run baseline comparison quality gate
        if: success()
        run: |
          # Quality gate requires: RMSE < season avg AND bias within +/- 1.0
          python scripts/baseline_comparison.py 2>&1 | tee -a logs/retrain_output.log
          GATE_EXIT=$?
          python scripts/validate_model_quality.py 2>&1 | tee -a logs/retrain_output.log || true
          if [ $GATE_EXIT -ne 0 ]; then
            echo "::warning::Model failed quality gate — does not beat season-average baseline"
          fi

      - name: Update retrain history
        if: success()
        run: |
          python -c "
          import json
          from datetime import datetime
          from pathlib import Path

          history_file = Path('logs/retrain_history.json')
          history = []
          if history_file.exists():
              try:
                  with open(history_file) as f:
                      history = json.load(f)
              except:
                  pass

          history.append({
              'timestamp': datetime.now().isoformat(),
              'success': True,
              'trigger': 'github_actions',
              'run_id': '${{ github.run_id }}'
          })

          # Keep last 50 entries
          history = history[-50:]

          with open(history_file, 'w') as f:
              json.dump(history, f, indent=2)
          "

      - name: Upload trained models as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-models-${{ github.run_id }}
          path: models/*.pkl
          retention-days: 30

      - name: Upload training logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14

      - name: Commit and push updated models
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add model files (logs/ is gitignored, so force-add retrain history)
          git add models/*.pkl
          git add models/probability_calibrators/*.pkl models/probability_calibrators/*.json || true
          git add models/quantile_decompression.json || true
          git add -f logs/retrain_history.json || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily model retrain $(date +%Y-%m-%d)

            Automated retraining via GitHub Actions.
            Run ID: ${{ github.run_id }}"
            git push
          fi

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Model retraining failed! Check the logs for details."
          # Could add Slack/Discord notification here
