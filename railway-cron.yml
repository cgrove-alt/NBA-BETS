# Railway Cron Jobs Configuration
# This file documents the cron schedules for Railway services
# Note: Railway doesn't use this file directly - schedules are configured in the Railway dashboard

# ============================================================================
# Service #2: Daily Predictions Service
# ============================================================================
# Service Type: Cron Job
# Start Command: python daily_predictions.py
# Schedule: 0 9 * * * (9 AM EST daily)
# Description: Generates predictions for all NBA games scheduled for today

daily_predictions:
  schedule: "0 9 * * *"  # Every day at 9 AM EST
  command: python daily_predictions.py
  timezone: America/New_York
  timeout: 600  # 10 minutes max execution time
  expected_duration: 300  # ~5 minutes typical
  retry_on_failure: true
  max_retries: 3
  success_criteria:
    - exit_code: 0
    - log_contains: "Predictions complete"
    - database_records: predictions_history table updated

# ============================================================================
# Service #3: Odds Tracker Service
# ============================================================================
# Service Type: Worker (Always-On Daemon)
# Start Command: python odds_tracker_service.py --daemon
# Schedule: Managed internally by APScheduler
# Description: Fetches betting odds every 5 minutes during operating hours

odds_tracker:
  service_type: worker
  command: python odds_tracker_service.py --daemon
  internal_schedule:
    - interval: "*/5 * * * *"  # Every 5 minutes
    - operating_hours: "8-23"  # 8 AM - 11 PM EST
    - season: "Oct-Jun"  # NBA season only
  health_check:
    - heartbeat_interval: 300  # 5 minutes
    - alert_threshold: 1800  # Alert if no activity for 30 minutes
  expected_memory: 200  # MB
  restart_policy: on_failure

# ============================================================================
# Service #4: Retraining Scheduler Service
# ============================================================================
# Service Type: Worker (Always-On Daemon)
# Start Command: python scheduled_retraining.py --daemon
# Schedule: Managed internally by APScheduler
# Description: Automatic model retraining and drift detection

retraining_scheduler:
  service_type: worker
  command: python scheduled_retraining.py --daemon
  internal_schedules:
    # Full retraining (all base models + meta-learner)
    full_retrain:
      schedule: "0 2 * * 0"  # Sundays at 2 AM EST
      frequency: "Every 14 days"
      expected_duration: 7200  # 2 hours max
      timeout: 7200
      success_criteria:
        - new_model_rmse <= old_model_rmse * 1.05  # Within 5% degradation
        - backtest_roi > 0  # Positive ROI

    # Incremental update (meta-learner only)
    incremental_update:
      schedule: "0 4 */3 * *"  # Every 3 days at 4 AM EST
      expected_duration: 900  # 15 minutes max
      timeout: 1800
      success_criteria:
        - exit_code: 0
        - meta_learner_updated: true

    # Drift detection (daily monitoring)
    drift_check:
      schedule: "0 6 * * *"  # Daily at 6 AM EST
      expected_duration: 120  # 2 minutes
      alert_conditions:
        - rmse_increase > 10%  # RMSE increased by 10%+
        - accuracy_drop_3_days: true  # 3 consecutive days of accuracy drop
        - r2_below_threshold: -0.5  # R² drops below -0.5
      action_on_drift:
        - trigger: full_retrain
        - send_alert: true

  health_check:
    - heartbeat_interval: 3600  # 1 hour
    - log_monitoring: true
  expected_memory: 1500  # MB during training
  restart_policy: on_failure

# ============================================================================
# Service #5: Pre-Game Intelligence Agent
# ============================================================================
# Service Type: Cron Job
# Start Command: python -m agents.core.agent_runner --agent pregame
# Schedule: Runs twice daily (morning intel + pre-tip update)
# Description: Gathers injury reports, lineup confirmations, schedule context
#              and synthesizes with LLM reasoning for game intelligence

pregame_agent:
  schedule:
    - "0 11 * * *"  # 11 AM ET — 6-8 hours before typical first tip-off
    - "0 17 * * *"  # 5 PM ET — 2 hours before first tip for late-breaking updates
  command: python -m agents.core.agent_runner --agent pregame
  timezone: America/New_York
  timeout: 600  # 10 minutes max
  expected_duration: 180  # ~3 minutes typical
  retry_on_failure: true
  max_retries: 2
  required_env:
    - GEMINI_API_KEY
    - DATABASE_URL
    - REDIS_URL
    - BALLDONTLIE_API_KEY

# ============================================================================
# Service #6: Post-Game Analysis Agent
# ============================================================================
# Service Type: Cron Job
# Start Command: python -m agents.core.agent_runner --agent postgame
# Schedule: After all games complete (~1 AM ET)
# Description: Reviews predictions vs actual results, analyzes misses with
#              LLM reasoning, detects patterns, generates model feedback

postgame_agent:
  schedule: "0 1 * * *"  # 1 AM ET — after all games complete
  command: python -m agents.core.agent_runner --agent postgame
  timezone: America/New_York
  timeout: 600  # 10 minutes max
  expected_duration: 120  # ~2 minutes typical
  retry_on_failure: true
  max_retries: 2
  required_env:
    - GEMINI_API_KEY
    - DATABASE_URL
    - REDIS_URL

# ============================================================================
# Service #8: Odds Monitoring Agent
# ============================================================================
# Service Type: Cron Job
# Start Command: python -m agents.core.agent_runner --agent odds_monitor
# Schedule: Every 15 minutes during game hours (8 AM - 11 PM ET)
# Description: Monitors line movements, detects steam moves and stale lines,
#              interprets sharp vs public money with LLM reasoning

odds_monitor_agent:
  schedule: "*/15 8-23 * * *"  # Every 15 min, 8 AM - 11 PM ET
  command: python -m agents.core.agent_runner --agent odds_monitor
  timezone: America/New_York
  timeout: 180  # 3 minutes max
  expected_duration: 60  # ~1 minute typical
  retry_on_failure: true
  max_retries: 2
  required_env:
    - GEMINI_API_KEY
    - DATABASE_URL
    - REDIS_URL
    - THE_ODDS_API_KEY

# ============================================================================
# Service #9: Prediction Orchestrator Agent
# ============================================================================
# Service Type: Cron Job
# Start Command: python -m agents.core.agent_runner --agent orchestrator
# Schedule: 11:30 AM ET (30 min after pregame's first run)
# Description: Coordinates prediction pipeline with agent intelligence —
#              confidence adjustments, correlation checks, bankroll sizing

orchestrator_agent:
  schedule: "30 11 * * *"  # 11:30 AM ET daily
  command: python -m agents.core.agent_runner --agent orchestrator
  timezone: America/New_York
  timeout: 900  # 15 minutes max
  expected_duration: 300  # ~5 minutes typical
  retry_on_failure: true
  max_retries: 2
  required_env:
    - GEMINI_API_KEY
    - DATABASE_URL
    - REDIS_URL
    - BALLDONTLIE_API_KEY

# ============================================================================
# Service #10: Model Watchdog Agent
# ============================================================================
# Service Type: Cron Job
# Start Command: python -m agents.core.agent_runner --agent watchdog
# Schedule: 1:30 AM ET (30 min after postgame)
# Description: Monitors model health, detects drift and degradation,
#              triggers retraining recommendations when statistically justified

watchdog_agent:
  schedule: "30 1 * * *"  # 1:30 AM ET daily
  command: python -m agents.core.agent_runner --agent watchdog
  timezone: America/New_York
  timeout: 300  # 5 minutes max
  expected_duration: 60  # ~1 minute typical
  retry_on_failure: true
  max_retries: 2
  required_env:
    - GEMINI_API_KEY
    - DATABASE_URL
    - REDIS_URL

# ============================================================================
# Service #11: Daily Briefing Agent
# ============================================================================
# Service Type: Cron Job
# Start Command: python -m agents.core.agent_runner --agent briefing
# Schedule: Noon + 6 PM ET (after orchestrator, then 1hr before tip-off)
# Description: Synthesizes all agent outputs into a clear daily briefing
#              for Colin — plain language, no jargon

briefing_agent:
  schedule:
    - "0 12 * * *"   # Noon ET — after orchestrator completes
    - "0 18 * * *"   # 6 PM ET — 1 hour before typical first tip-off
  command: python -m agents.core.agent_runner --agent briefing
  timezone: America/New_York
  timeout: 300  # 5 minutes max
  expected_duration: 60  # ~1 minute typical
  retry_on_failure: true
  max_retries: 2
  required_env:
    - GEMINI_API_KEY
    - DATABASE_URL
    - REDIS_URL

# ============================================================================
# Service #7: Redis (Provision via Railway dashboard)
# ============================================================================
# - Add Redis service from Railway's built-in integrations
# - Railway auto-sets REDIS_URL for linked services
# - Used by: agent message bus, future odds monitoring
# - No custom configuration needed

# ============================================================================
# Environment Variables Required
# ============================================================================
# All cron jobs and workers require these environment variables:
# - BALLDONTLIE_API_KEY (required)
# - DATABASE_URL (required, auto-provisioned by Railway)
# - THE_ODDS_API_KEY (optional, for odds tracker)
# - REDIS_URL (required for agents, auto-provisioned by Railway Redis)
# - GEMINI_API_KEY (required for agent LLM reasoning)
# - ALERT_EMAIL (optional, for alerts)
# - SLACK_WEBHOOK (optional, for alerts)
# - MAX_TRAINING_TIME (optional, default: 7200)

# ============================================================================
# Monitoring & Alerts
# ============================================================================
monitoring:
  # Railway automatically monitors service health
  railway_health_checks:
    - api_service: /api/health every 60s
    - worker_services: Process running check

  # Custom alerts (sent by services themselves)
  alerts:
    - retraining_complete:
        severity: info
        channels: [email, slack]
    - retraining_failed:
        severity: error
        channels: [email, slack]
    - drift_detected:
        severity: warning
        channels: [email, slack]
    - predictions_failed:
        severity: error
        channels: [email, slack]
    - odds_tracker_down:
        severity: warning
        channels: [email, slack]

# ============================================================================
# Cost Optimization Notes
# ============================================================================
# To reduce Railway costs:
# 1. Use Cron Jobs instead of Workers when possible
#    - Daily Predictions: ✅ Uses Cron Job (only runs once/day)
#    - Odds Tracker: ❌ Uses Worker (needs to run every 5 min)
#    - Retraining: ❌ Uses Worker (needs internal scheduler)
#
# 2. Optimize schedules
#    - Only fetch odds during NBA games (8 AM - 11 PM)
#    - Only run predictions on game days (check schedule first)
#    - Run retraining off-peak hours (2 AM)
#
# 3. Archive old data
#    - Delete odds_history older than 30 days
#    - Delete predictions_history older than 90 days
#
# 4. Use Railway's free tier
#    - $5/month credit included
#    - Sufficient for light usage

