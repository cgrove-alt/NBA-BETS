[pytest]
# Pytest configuration for NBA Betting Model

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --strict-markers
    --verbose
    --tb=short
    -ra

# Test markers for categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    api: marks tests that require API access
    model: marks tests that train or load ML models
    database: marks tests that require database access

# Timeout for individual tests (prevents hanging)
timeout = 30

# Coverage options
[coverage:run]
source = backend/
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
