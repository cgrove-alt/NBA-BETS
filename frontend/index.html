<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Oracle - NBA Betting Terminal</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00d4ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Oracle" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      body { margin: 0; background: #09090b; }
      #oracle-loader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #09090b; color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        transition: opacity 0.4s ease;
      }
      #oracle-loader.fade-out { opacity: 0; pointer-events: none; }
      #oracle-loader h1 {
        font-size: 1.5rem; letter-spacing: 0.3em; text-transform: uppercase;
        color: #00d4ff; margin: 0 0 1.5rem 0;
      }
      .oracle-spinner {
        width: 40px; height: 40px; border: 3px solid #27272a;
        border-top-color: #00d4ff; border-radius: 50%;
        animation: oracle-spin 0.8s linear infinite;
      }
      @keyframes oracle-spin { to { transform: rotate(360deg); } }
      #oracle-error {
        display: none; text-align: center; max-width: 400px; padding: 0 1rem;
      }
      #oracle-error p { color: #a1a1aa; font-size: 0.875rem; line-height: 1.5; }
      #oracle-error button {
        background: #00d4ff; color: #09090b; border: none; padding: 0.75rem 2rem;
        border-radius: 0.5rem; font-weight: 600; font-size: 0.875rem;
        cursor: pointer; margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="oracle-loader">
      <h1>The Oracle</h1>
      <div class="oracle-spinner" id="oracle-spinner"></div>
      <div id="oracle-error">
        <p>Something went wrong loading the app. This usually fixes itself with a refresh.</p>
        <button onclick="window.__oracleNuke()">Refresh</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Blank-page detection: if React hasn't mounted after 10s, nuke caches and show error
      window.__oracleTimeout = setTimeout(function() {
        var root = document.getElementById('root');
        if (!root || !root.hasChildNodes()) {
          document.getElementById('oracle-spinner').style.display = 'none';
          document.getElementById('oracle-error').style.display = 'block';
          // Nuclear recovery: unregister all service workers + clear all caches
          window.__oracleNuke();
        }
      }, 10000);

      window.__oracleNuke = function() {
        Promise.all([
          navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          }) : Promise.resolve(),
          caches ? caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }) : Promise.resolve()
        ]).then(function() {
          window.location.reload();
        }).catch(function() {
          window.location.reload();
        });
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
