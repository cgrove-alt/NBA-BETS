# Ruff configuration for NBA Betting Model
# Ruff is an extremely fast Python linter (10-100x faster than flake8)

line-length = 100

[lint]
# Enable comprehensive rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports, etc)
    "B",    # flake8-bugbear (common bugs and design problems)
    "C4",   # flake8-comprehensions (better list/dict/set comprehensions)
    "UP",   # pyupgrade (modern Python idioms)
    "SIM",  # flake8-simplify (simplification suggestions)
    "RET",  # flake8-return (return statement issues)
    "PTH",  # flake8-use-pathlib (use pathlib instead of os.path)
    "PD",   # pandas-vet (pandas best practices)
    "NPY",  # NumPy-specific rules
]

# Ignore specific rules that may be too strict for this project
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file (intentional in many cases)
    "E722",   # Do not use bare except (legacy code)
    "E741",   # Ambiguous variable name (short vars like 'l' used intentionally)
    "B007",   # Loop control variable not used (intentional in some cases)
    "B008",   # Do not perform function calls in argument defaults (FastAPI uses this)
    "B904",   # raise without from inside except (legacy code)
    "B018",   # Useless expression (legacy code)
    "F401",   # Unused imports (many intentional for feature detection in try/except)
    "UP007",  # Use X | Y for type annotations (not available in Python 3.9)
    "UP037",  # Remove quotes from type annotation (forward references needed)
    "PTH100", # os.path.abspath -> Path.resolve (style preference)
    "PTH103", # os.makedirs -> Path.mkdir (style preference)
    "PTH107", # os.remove -> Path.unlink (style preference)
    "PTH108", # os.unlink -> Path.unlink (style preference)
    "PTH109", # os.getcwd -> Path.cwd (style preference)
    "PTH110", # os.path.exists -> Path.exists (style preference)
    "PTH118", # os.path.join -> Path / operator (style preference)
    "PTH120", # os.path.dirname -> Path.parent (style preference)
    "PTH123", # open() -> Path.open() (style preference, not critical)
    "SIM102", # Collapsible if statements (style preference)
    "SIM103", # Return condition directly (style preference)
    "SIM105", # Use contextlib.suppress (style preference)
    "SIM108", # Use ternary operator (style preference)
    "SIM113", # Use enumerate (style preference)
    "SIM115", # Use context manager for files (legacy code)
    "SIM401", # Use dict.get instead of if block (style preference)
    "NPY002", # Replace legacy numpy random (requires refactoring)
    "PD011",  # Use .to_numpy() instead of .values (style preference)
    "RET505", # Unnecessary else after return (style preference)
]

# Exclude paths from linting
exclude = [
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".git",
    "build",
    "dist",
    "*.egg-info",
    "catboost_info",
    "frontend",
]

[lint.per-file-ignores]
# Test files can have additional flexibility
"tests/*.py" = ["F401", "F811"]  # Allow unused imports and redefinitions in tests
"test_*.py" = ["F401", "F811"]
