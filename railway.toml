[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
healthcheckPath = "/api/health"
healthcheckTimeout = 300

# Environment variables (set in Railway dashboard)
# Required:
# - BALLDONTLIE_API_KEY
# - DATABASE_URL (PostgreSQL, auto-provisioned by Railway)
# - REDIS_URL (Redis, auto-provisioned by Railway)
# - THE_ODDS_API_KEY
# Optional:
# - GEMINI_API_KEY (agent LLM reasoning; agents use deterministic fallback without it)
# - JWT_SECRET_KEY
# - API_KEY
# - FRONTEND_URL
# - AUTH_ENABLED (default: false)
# - ALERT_EMAIL (for monitoring alerts)
# - SLACK_WEBHOOK (for monitoring alerts)

# NOTE: Multi-Service Deployment Strategy
# ========================================
# This Railway project contains 5 app services + 2 databases (7 total):
#
# 1. API Service (this file's startCommand)
#    - Start command: python -m uvicorn backend.api:app --host 0.0.0.0 --port $PORT
#    - Handles all REST API endpoints
#    - Connects to shared PostgreSQL database
#
# 2. Daily Predictions Service
#    - Start command: python daily_predictions.py
#    - Cron schedule: 0 14 * * * (every day at 9 AM ET / 14:00 UTC)
#    - Generates predictions for all games
#    - Stores results in database and CSV
#
# 3. Odds Tracker Service
#    - Start command: python odds_tracker_service.py --daemon
#    - Runs continuously as background daemon
#    - Fetches odds every 5 minutes during operating hours (8 AM - 11 PM EST)
#    - NBA season only (Oct-Jun)
#
# 4. Retraining Scheduler Service
#    - Start command: python scheduled_retraining.py --daemon
#    - Runs continuously as background daemon
#    - Full retrain: Every 14 days (Sundays at 2 AM)
#    - Incremental update: Every 3 days at 4 AM
#    - Drift detection: Daily at 6 AM
#
# 5. Agent Scheduler (unified daemon for all 6 AI agents)
#    - Start command: python agent_scheduler.py --daemon
#    - Runs continuously as background daemon
#    - Uses APScheduler to run all 6 agents on their respective schedules:
#      pregame:      11 AM + 5 PM ET (injury/lineup intel)
#      postgame:     1 AM ET (post-game miss analysis)
#      odds_monitor: every 15 min, 8 AM-11 PM ET (line movements)
#      orchestrator: 11:30 AM ET (prediction pipeline)
#      watchdog:     1:30 AM ET (model health check)
#      briefing:     noon + 6 PM ET (daily briefing)
#    - Each agent runs in its own thread; failures are isolated
#    - Requires: REDIS_URL, GEMINI_API_KEY (optional)
#
# 6. PostgreSQL (provision via Railway dashboard)
#    - Railway auto-sets DATABASE_URL for linked services
#
# 7. Redis (provision via Railway dashboard)
#    - Railway auto-sets REDIS_URL for linked services
#    - Used by: agent message bus, inter-agent communication
#
# All services share:
# - Same GitHub repository
# - Same PostgreSQL database (DATABASE_URL)
# - Same environment variables (BALLDONTLIE_API_KEY, etc.)
#
# This architecture allows:
# - Independent scaling of API vs background jobs
# - Separate logs for debugging
# - Zero-downtime API during retraining
# - Automatic restarts if any service crashes
