[build]
builder = "nixpacks"

[deploy]
startCommand = "python -m uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
healthcheckPath = "/api/health"
healthcheckTimeout = 300

# Environment variables (set in Railway dashboard)
# Required:
# - BALLDONTLIE_API_KEY
# - DATABASE_URL (PostgreSQL, auto-provisioned by Railway)
# - REDIS_URL (Redis, auto-provisioned by Railway)
# - THE_ODDS_API_KEY
# Optional:
# - GEMINI_API_KEY (agent LLM reasoning; agents use deterministic fallback without it)
# - JWT_SECRET_KEY
# - API_KEY
# - FRONTEND_URL
# - AUTH_ENABLED (default: false)
# - ALERT_EMAIL (for monitoring alerts)
# - SLACK_WEBHOOK (for monitoring alerts)

# NOTE: Multi-Service Deployment Strategy
# ========================================
# This Railway project should contain 4 separate services:
#
# 1. API Service (this file)
#    - Start command: python -m uvicorn backend.api:app --host 0.0.0.0 --port $PORT
#    - Handles all REST API endpoints
#    - Connects to shared PostgreSQL database
#
# 2. Daily Predictions Service
#    - Start command: python daily_predictions.py
#    - Cron schedule: 0 9 * * * (every day at 9 AM EST)
#    - Generates predictions for all games
#    - Stores results in database and CSV
#
# 3. Odds Tracker Service
#    - Start command: python odds_tracker_service.py --daemon
#    - Runs continuously as background daemon
#    - Fetches odds every 5 minutes during operating hours (8 AM - 11 PM EST)
#    - NBA season only (Oct-Jun)
#
# 4. Retraining Scheduler Service
#    - Start command: python scheduled_retraining.py --daemon
#    - Runs continuously as background daemon
#    - Full retrain: Every 14 days (Sundays at 2 AM)
#    - Incremental update: Every 3 days at 4 AM
#    - Drift detection: Daily at 6 AM
#
# 5. Pre-Game Intelligence Agent
#    - Start command: python -m agents.core.agent_runner --agent pregame
#    - Cron schedule: 0 11,17 * * * (11 AM + 5 PM ET)
#    - Gathers injury/lineup intel, synthesizes with LLM
#
# 6. Post-Game Analysis Agent
#    - Start command: python -m agents.core.agent_runner --agent postgame
#    - Cron schedule: 0 1 * * * (1 AM ET)
#    - Analyzes prediction misses, detects patterns
#
# 7. Redis (Provision via Railway dashboard)
#    - Add Redis service from Railway's built-in integrations
#    - Railway auto-sets REDIS_URL for linked services
#    - Used by: agent message bus, inter-agent communication
#
# 8. Odds Monitor Agent
#    - Start command: python -m agents.core.agent_runner --agent odds_monitor
#    - Cron schedule: */15 8-23 * * * (every 15 min, 8 AM - 11 PM ET)
#    - Tracks line movements, detects steam/RLM, alerts on edge erosion
#    - Requires: THE_ODDS_API_KEY, REDIS_URL, GEMINI_API_KEY (optional)
#
# 9. Prediction Orchestrator Agent
#    - Start command: python -m agents.core.agent_runner --agent orchestrator
#    - Cron schedule: 30 11 * * * (11:30 AM ET, after pregame intel)
#    - Coordinates prediction pipeline, adjusts confidence, generates signals
#    - Requires: BALLDONTLIE_API_KEY, REDIS_URL, GEMINI_API_KEY (optional)
#
# 10. Model Watchdog Agent
#    - Start command: python -m agents.core.agent_runner --agent watchdog
#    - Cron schedule: 30 1 * * * (1:30 AM ET, after postgame)
#    - Monitors model drift, feature staleness, performance degradation
#    - Requires: REDIS_URL, GEMINI_API_KEY (optional)
#
# 11. Daily Briefing Agent
#    - Start command: python -m agents.core.agent_runner --agent briefing
#    - Cron schedule: 0 12,18 * * * (12 PM + 6 PM ET)
#    - Synthesizes all agent outputs into plain-language daily brief
#    - Requires: REDIS_URL, GEMINI_API_KEY (optional)
#
# All services share:
# - Same GitHub repository
# - Same PostgreSQL database (DATABASE_URL)
# - Same environment variables (BALLDONTLIE_API_KEY, etc.)
#
# Railway Cron Service Setup:
# ---------------------------
# For services #2-4, create separate Railway services with:
# - Service name: nba-betting-{service-name}
# - Same repo link
# - Custom start command (see above)
# - Shared environment variables
# - Shared PostgreSQL database link
#
# This architecture allows:
# - Independent scaling of API vs background jobs
# - Separate logs for debugging
# - Zero-downtime API during retraining
# - Automatic restarts if any service crashes
